<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" fill="none" overflow="visible"><style>
.s-lens{animation:scan 3.8s ease-in-out infinite}.glint{animation:glint 3.8s ease-in-out infinite}
.p-g{animation:pluspop 3.2s cubic-bezier(.3,1.5,.5,1) infinite}
.sm1{animation:smoke 3s ease-out infinite}.sm2{animation:smoke 3s ease-out 1.2s infinite}
.door{animation:flick 2.6s ease-in-out infinite}.tw{animation:twinkle 2.8s ease-in-out infinite}
.chev{animation:nudge 2.4s ease-in-out infinite}.q{animation:bob 2.2s ease-in-out infinite}
.gear{transform-box:view-box;transform-origin:16px 16px;animation:spin 16s linear infinite}
svg *{transform-box:fill-box;transform-origin:center}.gear{transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{0%,100%{transform:translate(0,0)}30%{transform:translate(2px,-1.5px)}60%{transform:translate(-1px,1.5px)}}
@keyframes glint{0%,100%{opacity:.35}40%{opacity:1}}
@keyframes pluspop{0%,65%{transform:rotate(0) scale(1)}85%{transform:rotate(90deg) scale(1.15)}100%{transform:rotate(90deg) scale(1)}}
@keyframes smoke{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-8px);opacity:0}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.65}60%{opacity:1}}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.6}50%{transform:scale(1.2) rotate(30deg);opacity:1}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-2.5px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="21" y="8" width="4" height="6" rx="1" fill="#dbe7ff"/><circle class="sm1" cx="23" cy="6" r="1.8" fill="#dbe7ff"/><circle class="sm2" cx="24.5" cy="4.5" r="1.3" fill="#dbe7ff"/><path d="M6.5 15.5V26a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2V15.5" fill="#2f6fdf" fill-opacity=".5" stroke="#dbe7ff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M3.5 16L16 5l12.5 11" fill="none" stroke="#dbe7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect class="door" x="13" y="18.5" width="6" height="9.5" rx="2" fill="#f5c23a"/></svg>